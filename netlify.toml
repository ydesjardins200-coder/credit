# Netlify configuration for iBoost frontend

[build]
  publish = "public"
  # Generate public/assets/js/config.js from Netlify environment variables.
  # SUPABASE_URL, SUPABASE_ANON_KEY, and API_BASE_URL must be set in the
  # Netlify dashboard under Site settings → Environment variables.
  command = """
    printf 'window.IBOOST_CONFIG = {\\n  SUPABASE_URL: "%s",\\n  SUPABASE_ANON_KEY: "%s",\\n  API_BASE_URL: "%s"\\n};\\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$API_BASE_URL" > public/assets/js/config.js
  """

# SPA-style fallback: if you later add client-side routing, uncomment:
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# ---------------------------------------------------------------------------
# Account page architecture refactor — backward-compat redirects
# ---------------------------------------------------------------------------
# Phase C of the account-architecture refactor (see
# docs/account-architecture.md) extracted Education into its own page at
# /account/education. Users with bookmarks to the old monolith URLs need
# to land on the right place.
#
# Phase D will add similar redirects for the other tabs (Profile, Offers,
# Credit, Budget, Welcome) as each one is extracted.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/account.html"
  query = { tab = "education" }
  to = "/account/education"
  status = 301
  force = true

[[redirects]]
  from = "/account.html"
  query = { tab = "profile" }
  to = "/account/profile"
  status = 301
  force = true

[[redirects]]
  from = "/account.html"
  query = { tab = "offers" }
  to = "/account/offers"
  status = 301
  force = true

[[redirects]]
  from = "/account.html"
  query = { tab = "budget" }
  to = "/account/budget"
  status = 301
  force = true

[[redirects]]
  from = "/account.html"
  query = { tab = "credit" }
  to = "/account/credit"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Pretty-URL variants — Netlify auto-strips .html from URLs
# ---------------------------------------------------------------------------
# Netlify's default behavior strips the .html extension when serving HTML
# files (the "Pretty URLs" feature). So when a browser navigates to
# /account.html?tab=credit, Netlify Edge serves it as /account?tab=credit
# in the URL bar — and the redirect rules above (which match
# from = "/account.html") never fire.
#
# These mirror rules catch the pretty-URL form. Without them, anyone
# clicking a link like /account.html?tab=credit (from old bookmarks or
# external sites linking to us) lands on the monolith Welcome page
# instead of the standalone tab page.
#
# Found via real-user trace 2026-04-30: tab nav from /account/budget
# clicking Credit redirected to /account?tab=credit (pretty URL) and
# served account.html → which falls back to Welcome since 'credit' is
# no longer in VALID_TABS.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/account"
  query = { tab = "education" }
  to = "/account/education"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  query = { tab = "profile" }
  to = "/account/profile"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  query = { tab = "offers" }
  to = "/account/offers"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  query = { tab = "budget" }
  to = "/account/budget"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  query = { tab = "credit" }
  to = "/account/credit"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# DEV MODE — NO CACHE ANYWHERE
# ---------------------------------------------------------------------------
# While we're iterating on the site, every browser (including Yan's and the
# partners') should always re-fetch every file from Netlify. This eliminates
# the need for hard-refresh after every push.
#
# Trade-off: every page load re-downloads every asset. That's fine for a
# low-traffic dev site but will hurt performance + bandwidth in production.
#
# BEFORE PUBLIC LAUNCH:
#   Restore aggressive caching per asset type. See
#   docs/LAUNCH_CHECKLIST.md section "Cache strategy before launch".
# ---------------------------------------------------------------------------

# Security headers + no-cache applied to ALL responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # DEV MODE: disable all caching. Remove these 3 lines before launch.
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    # Tighten CSP once you know all required origins (Supabase URL, API URL, etc.)
    # Content-Security-Policy = "default-src 'self'; ..."
